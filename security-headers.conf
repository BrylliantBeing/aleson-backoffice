# Security response headers, included by every location in nginx.conf.
#
# It has to be an include rather than a single block at server level because of
# how nginx inherits add_header: a location that declares ANY add_header of its
# own drops every add_header inherited from its parent. Several locations here
# set Cache-Control or Content-Type, so headers declared once at the top would
# silently vanish on exactly the responses that matter (index.html, the JS
# bundles). `include` in each of them is the only form that survives that rule.
#
# `always` makes these apply to error responses too, not just 2xx/3xx.

# This is a staff tool (the ticketing back office). It has no business being framed by anything, and
# frame-ancestors is what stops an attacker overlaying an invisible copy of the
# dashboard over their own page and harvesting clicks on it.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# X-Frame-Options is the same control for browsers predating CSP level 2.
add_header X-Frame-Options "DENY" always;

# Stops the browser second-guessing a declared Content-Type. Without it a file
# served as text/plain can be sniffed into script and executed.
add_header X-Content-Type-Options "nosniff" always;

# Don't leak the dashboard's own URLs (which carry ids) to third-party hosts.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing in an admin dashboard needs any of these. Denying them means a
# compromised bundle cannot quietly reach for them either.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# The tunnel terminates TLS, so the browser always sees HTTPS even though this
# container listens on plain 8080. Two years, subdomains included.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# The full policy, REPORT-ONLY for now.
#
# Expo web injects styles at runtime and its static export emits inline
# bootstrap script, so a strict script-src/style-src would white-screen the app
# — and that is not something to discover in production. Report-Only lets the
# violations show up in the browser console against the real bundle first.
#
# connect-src no longer names the cloud API host: the bundle calls a relative
# /api/v1/... that nginx.conf proxies, so 'self' already covers it whether the
# page was reached over the LAN or the tunnel. It does still name the local
# print agent (see src/utils/printer.ts): the counter's browser posts ESC/POS
# bytes to it on loopback, and a CSP without it would block every ticket print
# once this is enforced.
#
# To enforce: watch the console through a full session (login, every dashboard
# screen, a save), settle the directives, then rename this header to
# Content-Security-Policy and fold the frame-ancestors line above into it.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:9101 http://localhost:9101; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
