server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Expo Router web output ("static") prerenders per-route HTML but the app
    # is still client-routed; unknown/dynamic paths must fall back to
    # index.html or deep links 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles under /_expo/static are content-addressed, so they can be
    # cached forever. index.html must never be, or clients pin to a stale bundle.
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Container-local healthcheck target; not routed publicly.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    client_max_body_size 8m;
    server_tokens off;
}
