server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Repeated in every location below that sets an add_header of its own —
    # nginx drops inherited add_headers from any block that declares one.
    include /etc/nginx/snippets/security-headers.conf;

    # Expo Router web output ("static") prerenders per-route HTML but the app
    # is still client-routed; unknown/dynamic paths must fall back to
    # index.html or deep links 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles under /_expo/static are content-addressed, so they can be
    # cached forever. index.html must never be, or clients pin to a stale bundle.
    location /_expo/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Same-origin API proxy, mirroring the one in aleson-website/nginx.conf.
    # This is what lets EXPO_PUBLIC_API_BASE_URL be empty (see src/utils/api.ts):
    # the bundle calls a relative /api/v1/..., so the API host is always whatever
    # host the page itself was loaded from. That is the whole point — the same
    # image serves the LAN and Tailscale (http://192.168.1.200:30080, the
    # backoffice-lan NodePort in aleson-website/deploy/k8s/07-backoffice.yaml)
    # and the tunnel
    # (https://backoffice.aleson-shipping.com) with no rebuild, and on the LAN
    # the request never leaves the building. It also means the browser makes no
    # cross-origin request, so the allowlist in main.py stops mattering here.
    location ^~ /api/v1/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Container-local healthcheck target; not routed publicly.
    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    client_max_body_size 8m;
    server_tokens off;
}
