# Builds the ticketing-office image and pushes it to GHCR as
# ghcr.io/<owner>/aleson-backoffice. Deploying is still manual on purpose —
# see aleson-website/deploy/k8s/README.md ("Update / redeploy"): this cluster
# is not reachable from GitHub, so the rollout is a kubectl command you run
# afterwards.
name: Build and push backoffice image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase repository names, and the owner here is
      # "BrylliantBeing" — so it has to be lowercased rather than used as-is.
      - name: Resolve image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aleson-backoffice" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces :latest (default branch only) plus :sha-<short> so a bad
      # rollout can be pinned back to a known-good build.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # EXPO_PUBLIC_* is inlined by Metro at BUILD time, so the API base URL is
      # baked into this image and cannot be changed by a k8s env var later.
      # src/utils/api.ts expects the HOST ONLY (no /api/v1 suffix — request
      # paths already carry it), unlike the booking site whose value bakes the
      # prefix in. Override via an EXPO_PUBLIC_API_BASE_URL repository variable
      # (Settings → Secrets and variables → Actions → Variables).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            EXPO_PUBLIC_API_BASE_URL=${{ vars.EXPO_PUBLIC_API_BASE_URL || 'https://aleson-test-2.brylletan.com' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
